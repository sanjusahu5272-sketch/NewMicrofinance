# =============================================================================
# docker-compose.prod.yml — Production Stack
# Laravel 13 + PHP 8.5-FPM + PostgreSQL 17 + Redis 7 + Nginx + Horizon
# =============================================================================
# Services:
#   db       — PostgreSQL 17 (internal network, never exposed)
#   redis    — Redis 7 with AOF persistence
#   app      — PHP 8.5-FPM + Laravel 13
#   scheduler — Laravel Scheduler (cron jobs every minute)
#   horizon  — Queue worker + monitoring dashboard
#   nginx    — Reverse proxy, TLS termination, rate limiting
# =============================================================================

services:
  db:
    image: postgres:17-alpine
    restart: always
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - neev_prod_pgdata:/var/lib/postgresql/data
    networks:
      - neev_db_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - neev_prod_redisdata:/data
    networks:
      - neev_app_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.production
    environment:
      APP_ENV: "production"
      APP_DEBUG: "false"
      DB_CONNECTION: "pgsql"
      DB_HOST: "db"
      DB_PORT: "5432"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      QUEUE_CONNECTION: "redis"
    volumes:
      - neev_prod_media_vault:/var/www/html/storage/app/kyc_vault
      - neev_prod_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neev_db_internal
      - neev_app_internal

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.production
    command: ["sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neev_db_internal
      - neev_app_internal

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.production
    command: ["php", "artisan", "horizon"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neev_db_internal
      - neev_app_internal

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./deploy/nginx/laravel.conf:/etc/nginx/conf.d/default.conf:ro
      - neev_prod_nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - neev_app_internal
      - neev_public_edge
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- http://127.0.0.1:80/api/health/ready || exit 1"
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  neev_db_internal:
    driver: bridge
    internal: true
  neev_app_internal:
    driver: bridge
    internal: true
  neev_public_edge:
    driver: bridge

volumes:
  neev_prod_pgdata:
    name: neev_prod_pgdata
  neev_prod_redisdata:
    name: neev_prod_redisdata
  neev_prod_media_vault:
    name: neev_prod_media_vault
  neev_prod_logs:
    name: neev_prod_logs
  neev_prod_nginx_logs:
    name: neev_prod_nginx_logs
