# =============================================================================
# PostgreSQL 17 Production Configuration for Financial Durability (Section 49.7)
# =============================================================================
listen_addresses = '*'
port = 5432
max_connections = 120

# Memory & Durability (ACID Strict — Never disable fsync or synchronous_commit!)
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB
fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = replica
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9

# Timeouts & Lock Safety for Financial Transactions
statement_timeout = 30000
lock_timeout = 10000
idle_in_transaction_session_timeout = 60000
deadlock_timeout = 1s

# Password Encryption & Audit Logging
password_encryption = scram-sha-256
log_destination = 'stderr'
logging_collector = off
log_connections = on
log_disconnections = on
log_lock_waits = on
log_min_duration_statement = 500
log_statement = 'ddl'
timezone = 'Asia/Kolkata'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
