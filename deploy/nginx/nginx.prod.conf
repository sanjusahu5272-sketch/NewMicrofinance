# =============================================================================
# Nginx Production TLS Reverse Proxy & Rate Limiting (Section 49.6 & 49.7)
# =============================================================================
limit_req_zone $binary_remote_addr zone=neev_login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=neev_api_limit:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=neev_webhook_limit:10m rate=20r/s;

upstream neev_gunicorn_backend {
    server backend:8000 fail_timeout=10s max_fails=3;
    keepalive 32;
}

# Redirect ALL plaintext HTTP (port 80) to HTTPS (port 443)
server {
    listen 80;
    listen [::]:80;
    server_name finance.example.org;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name finance.example.org;
    server_tokens off;

    # TLS 1.2 & TLS 1.3 Only (Let's Encrypt / Enterprise CA)
    ssl_certificate     /etc/letsencrypt/live/finance.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finance.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:NeevSSL:10m;
    ssl_session_tickets off;

    # Strict Security Headers for Real Customer Money
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    client_max_body_size 16m;
    root /usr/share/nginx/html;
    index index.html;

    # Explicitly deny any direct access to KYC vault or dotfiles
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ^~ /media_vault_nonexec/ {
        deny all;
    }

    # Brute-force protection on authentication endpoints
    location ~ ^/api/(auth/login|auth/super-admin-login|auth/developer-admin-login|token) {
        limit_req zone=neev_login_limit burst=5 nodelay;
        proxy_pass http://neev_gunicorn_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Payment Gateway Webhooks (Raw body preserved intact for HMAC-SHA256 verification)
    location ^~ /api/webhooks/ {
        limit_req zone=neev_webhook_limit burst=20 nodelay;
        proxy_pass http://neev_gunicorn_backend;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Core Financial REST API
    location /api/ {
        limit_req zone=neev_api_limit burst=60 nodelay;
        proxy_pass http://neev_gunicorn_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Immutable Hashed Frontend Assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA Router Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
