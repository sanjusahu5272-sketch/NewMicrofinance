# ============================================================================
# Nginx Production Config — Laravel 13 + PHP 8.5-FPM Docker Stack
# ============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=neev_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=neev_api:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=neev_webhook:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=neev_general:10m rate=60r/s;

# ── HTTP → HTTPS Redirect ──
server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Server ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;
    server_tokens off;

    # TLS 1.2 & 1.3 Only
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:NeevSSL:10m;
    ssl_session_tickets off;

    # Security Headers (HSTS already set by Laravel middleware, but also here as fallback)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    client_max_body_size 25M;
    root /var/www/html/public;
    index index.php index.html;

    # Deny dotfiles
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ── Login: strict rate limit ──
    location ~ ^/api/(auth/login|auth/2fa/verify)$ {
        limit_req zone=neev_login burst=5 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 60s;
    }

    # ── Webhooks: preserve raw body ──
    location ^~ /api/webhooks/ {
        limit_req zone=neev_webhook burst=20 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 60s;
    }

    # ── API: general rate limit ──
    location /api/ {
        limit_req zone=neev_api burst=60 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 60s;
    }

    # ── Static assets: immutable cache ──
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── PHP execution ──
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 60s;
    }

    # ── SPA fallback ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
