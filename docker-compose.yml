# =============================================================================
# docker-compose.yml — Unified Pure Laravel 11 (PHP 8.3-FPM) + PostgreSQL 16 + Redis + Nginx Stack
# Python/Django and SQLite have been completely decommissioned.
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-neev_microfinance_db}
      POSTGRES_USER: ${DB_USERNAME:-neev_mfi_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - neev_pgdata:/var/lib/postgresql/data
    networks:
      - neev_internal
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER:-neev_mfi_user}" -d "$${POSTGRES_DB:-neev_microfinance_db}"'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - neev_redisdata:/data
    networks:
      - neev_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - neev_media_vault:/var/www/html/storage/app/kyc_vault
      - neev_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neev_internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./deploy/nginx/laravel.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - neev_internal
      - neev_edge
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- http://127.0.0.1:80/api/health/ready || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  neev_internal:
    driver: bridge
    internal: true
  neev_edge:
    driver: bridge

volumes:
  neev_pgdata:
    name: neev_microfinance_pgdata
  neev_redisdata:
    name: neev_microfinance_redisdata
  neev_media_vault:
    name: neev_microfinance_media_vault
  neev_logs:
    name: neev_microfinance_logs
